<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - SwiftCart</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="font-['Poppins',sans-serif]">
    <div id="navbar"></div>

    <section id="">
      <h1 class="text-3xl text-center font-bold py-10">All Products</h1>
      \
      <div class="products-catgory"></div>

      <div class="max-w-7xl mx-auto px-2 py-2">
        <!-- <h2 class="text-2xl font-bold text-gray-800 mb-6">Shop by Category</h2> -->

        <div
          id="category-list"
          class="flex flex-wrap gap-3 justify-center"
        ></div>
      </div>

      <!-- search -->
      <div class="max-w-md mt-3 mx-auto mb-6">
        <input
          id="search-input"
          type="text"
          placeholder="Search products..."
          class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-600"
        />
      </div>
    </section>
    <!-- all-product -->
    <section
      id="card-container"
      class="bg-gray-100 p-10 w-11/12 mx-auto my-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-10"
    >
      <h1>hello product</h1>
    </section>

    <!-- details -->
    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
    <dialog id="my_modal_1" class="modal">
      <div class="modal-box max-w-4xl">
        <div id="details-container"></div>

        <div class="modal-action">
          <form method="dialog">
            <button class="btn">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <script src="./js/common.js"></script>
    <script src="./js/products.js"></script>
  </body>
</html>
